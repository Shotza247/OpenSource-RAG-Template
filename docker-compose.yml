services:
  redis:
    image: redis:8.2.1
    profiles: ["cache"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["chroma"]
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data
volumes:
  qdrant_data:
  chroma_data:
